[project]
name = "outlook-desktop-mcp"
version = "0.5.0"
description = "Run this on Windows and get Outlook Desktop as an MCP server. No Graph API, no Entra app registration — just your local Outlook."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "JackDDavis", email = "24422671+JackDDavis@users.noreply.github.com" },
]
keywords = ["mcp", "outlook", "email", "com", "automation", "windows", "microsoft", "claude"]
license = "AGPL-3.0-only"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Email",
    "Topic :: Office/Business :: Office Suites",
]
dependencies = [
    "pywin32>=310",
    "mcp[cli]>=1.26.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/JackDDavis/outlook-desktop-mcp"
Repository = "https://github.com/JackDDavis/outlook-desktop-mcp"
Issues = "https://github.com/JackDDavis/outlook-desktop-mcp/issues"
Upstream = "https://github.com/Aanerud/outlook-desktop-mcp"

[project.scripts]
outlook-desktop-mcp = "outlook_desktop_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/outlook_desktop_mcp"]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
addopts = "-m 'not live_outlook'"
markers = [
    "acceptance: hermetic reliability acceptance coverage",
    "reliability_criterion(name): one of the eight v0.5.0 acceptance criteria",
    "live_outlook: opt-in tests that use a real Windows Outlook profile",
]
